<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      'unsafe-inline' 是为了 vite dev 的 react-refresh preamble（内联脚本）；
      桌面端不加载任何远程内容，安全边界由 contextIsolation + 白名单 preload 保证。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: http://localhost:*"
    />
    <title>Screen Share — 接收端</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
